    Fan, symbolic. Drawn for this project: neither Breeze nor the BigLinux
    icon theme ships a fan glyph. Three identical blades at exactly 120°
    around a hub centred on the 16 px grid, each swept back and meeting the
    hub so the three read as one rotor rather than three separate marks.
    Being unchanged by a third of a turn, it spins without wobbling.
    Filled with currentColor so the toolkit recolours it as a mask.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <g fill="currentColor">
    <path d="M7.459,6.231 Q5.7,4.319 2.965,3.137 A7.0,7.0 0 0 1 10.394,1.422 Q8.931,4.264 8.541,6.231 Z"/>
    <path d="M9.803,8.416 Q12.337,7.849 14.729,6.071 A7.0,7.0 0 0 1 12.5,13.362 Q10.769,10.674 9.262,9.353 Z"/>
    <path d="M6.738,9.353 Q5.962,11.832 6.307,14.792 A7.0,7.0 0 0 1 1.106,9.216 Q4.299,9.061 6.197,8.416 Z"/>
    <circle cx="8" cy="8" r="2.15"/>
  </g>
</svg>
